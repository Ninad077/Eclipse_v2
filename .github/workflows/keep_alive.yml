name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to keep it awake
        run: |
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" https://eclipsev2.streamlit.app/
